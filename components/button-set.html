<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan Tombol</title>

  <style>
    
    body {
      background-color: #fff0f5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px 20px;
    }

    h2 {
      color: #6b4150;
      font-size: 20px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .button-group .btn {
      margin-right: 10px;
      margin-bottom: 10px;
    }

    .btn-primary {
      background-color: #e75480;
      color: white;
    }

    .btn-secondary {
      background-color: rgb(255, 205, 220);
    }

    .btn-outline {
      background-color: white;
      border: 2px solid #e75480;
    }

    .btn-send {
      background-color: rgba(255, 153, 102, 0.9);
      color: white;
    }

    .btn-secondary, .btn-outline {
      color: #6b4150;
    }

    /* Pseudo-class: saat kursor di atas tombol */
    .btn-primary:hover {
      background-color: #c2185b;
    }

    .btn-secondary:hover {
      background-color: rgb(255, 170, 195);
    }

    .btn-outline:hover {
      background-color: #ffe4ec;
    }

    .btn-send:hover {
      background-color: rgba(230, 120, 70, 1);
    }
  </style>
</head>

<body>

  <main>
    <h2>Kumpulan Tombol</h2>

    <div class="button-group">
      <a href="#" class="btn btn-primary">Lihat Proyek</a>
      <a href="#" class="btn btn-secondary">Unduh CV</a>
      <a href="#" class="btn btn-outline">Hubungi Saya</a>
      <a href="#" class="btn btn-send">Kirim Pesan</a>
    </div>
  </main>

  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>

</body>
</html>
