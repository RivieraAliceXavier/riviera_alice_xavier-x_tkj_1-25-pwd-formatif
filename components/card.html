<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Proyek</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #fff0f5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 320px;
      padding: 20px;
      border: 2px solid #e75480;
      margin: 30px auto;
      background-color: white;
      border-radius: 15px;
    }

    .card img {
      width: 100%;
      height: 160px;
      display: block;
      object-fit: cover;
      border-radius: 10px;
    }

    .card h3 {
      color: #6b4150;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 15px;
      color: #8a6a75;
    }

    .card a {
      color: #e75480;
    }

    footer {
      text-align: center;
      padding-bottom: 20px;
    }

    footer a {
      color: #c75b7a;
    }
  </style>
</head>

<body>

  <main>
    <div class="card">
      <img src="../assets/images/minion.jpg" alt="Gambar proyek">
      <h3>Website Toko Online</h3>
      <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
      <a href="#">Lihat Proyek</a>
    </div>
  </main>

  <footer>
    <a href="../index.html">Kembali ke Beranda</a>
  </footer>

</body>
</html>
